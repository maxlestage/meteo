[workspace]

[package]
name = "klima-site"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
klima-core = { path = "../klima-core" }
klima-api = { path = "../klima-api" }
klima-ui = { path = "../klima-ui" }
yew = { version = "0.23", features = ["csr"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
  "IntersectionObserver", "IntersectionObserverInit", "IntersectionObserverEntry",
  "MediaQueryList", "EventTarget", "Node", "AddEventListenerOptions",
  "CssStyleDeclaration",
] }
wasm-bindgen-futures = "0.4.79"

# Ce qui part sur le réseau compte plus que ce qui compile vite : une parcelle
# se consulte au champ, souvent sur un réseau qui traîne. On optimise donc pour
# la taille, en une seule unité de compilation, et sans le code de déroulement
# des paniques — en WebAssembly, une panique arrête de toute façon la page.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
