<!doctype html>
<html lang="fr">
  <head>

      name="description"

    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- L'aperçu des liens partagés. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klima" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:title" content="Klima — la météo de votre ville" />

      property="og:description"
      content="Neuf sources météo recoupées pour dire, dans votre ville, quand il pleuvra, quoi emporter, la force du soleil et la qualité de l’air."

    <meta name="twitter:title" content="Klima — la météo de votre ville" />

      name="twitter:description"

    <!-- La police d'affichage est servie depuis le site : aucun appel à un tiers. -->

      rel="preload"
      href="./fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
      <link data-trunk rel="css" href="styles.css" />
    <link data-trunk rel="copy-dir" href="public" data-target-path="." />

  <body>
    <!-- L'écran d'entrée : le signe se trace pendant que la page se monte.
         Il ne dépend pas du WebAssembly et s'en va de lui-même. -->
    <div class="porte" aria-hidden="true">
      <svg class="porte__signe" viewBox="0 0 1024 1024">
        <rect class="porte__trace porte__trace--carreau" x="8" y="8" width="1008" height="1008" rx="229" pathLength="1" />
        <rect class="porte__trace" x="322" y="276" width="96" height="560" rx="48" pathLength="1" />
        <path class="porte__trace" d="M418 556c118-36 214-124 286-244 22 148-70 268-206 316Z" pathLength="1" />
        <path class="porte__trace porte__trace--feuille" d="M418 556c118 36 214 124 286 244 22-148-70-268-206-316Z" pathLength="1" />
        <circle class="porte__trace porte__trace--pluie" cx="370" cy="240" r="52" pathLength="1" />
      </svg>
      <span class="porte__compte"></span>
    </div>
    <div class="grain" aria-hidden="true"></div>
    <!-- Le fil d'avancée dans la page, mené par le défilement lui-même. -->
    <div class="progression" aria-hidden="true"></div>
    <div id="root"></div>
  </body>
