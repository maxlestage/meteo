# Espace de travail Rust de Klima.
#
# Il arrive à côté du TypeScript, pas à sa place : le relais Bun sert toujours
# la production pendant que celui-ci se construit. On ne débranche qu'une fois
# le remplaçant prouvé.
[workspace]
members = ["klima-api", "klima-core", "klima-relay"]
# Les interfaces se construisent pour le navigateur, pas pour la machine :
# les laisser dans l'espace de travail ferait compiler Yew à chaque `cargo
# test`, pour un binaire que personne n'exécuterait.
exclude = ["klima-web"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Versions relevées sur crates.io le 3 octobre 2026.
axum = { version = "0.8.9", features = ["ws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "system-proxy"] }
serde_json = "1.0.151"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
