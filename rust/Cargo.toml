# Espace de travail Rust de Klima.
#
# Il arrive à côté du TypeScript, pas à sa place : le relais Bun sert toujours
# la production pendant que celui-ci se construit. On ne débranche qu'une fois
# le remplaçant prouvé.
[workspace]
members = ["klima-core", "klima-relay"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Versions relevées sur crates.io le 3 octobre 2026.
axum = "0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
