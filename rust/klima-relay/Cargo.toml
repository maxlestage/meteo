[package]
name = "klima-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
klima-core = { path = "../klima-core" }
# Lire la prévision qu'on pousse aux îles dynamiques : le même décodage que
# les clients, pas un second.
klima-api = { path = "../klima-api" }
axum.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
# Vérifier les jetons d'Apple (RS256) et signer les sessions du relais (HS256).
# Le moteur cryptographique en Rust pur : pas de bibliothèque système à lier,
# donc rien qui casse sur la pile du buildpack.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
# Le corps de la clé APNs (.p8). Déjà tiré par jsonwebtoken : rien de plus à
# compiler.
base64 = "0.22"
# Les tuiles de la mosaïque radar sont compressées en deflate. Rust pur,
# comme le reste.
flate2 = "1"

[dev-dependencies]
# Un vrai client WebSocket, pour tester le direct de bout en bout.
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
# Les tests fabriquent leur propre paire de clés à l'exécution, pour signer des
# jetons « à la manière d'Apple » : aucune clé privée n'est commitée.
rsa = "0.9"
rand = "0.8"
# Une clé APNs d'essai, au format d'Apple, fabriquée à l'exécution.
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
