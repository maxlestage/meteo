[workspace]

[package]
name = "klima-ui"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
klima-core = { path = "../klima-core" }
klima-api = { path = "../klima-api" }
yew = { version = "0.23", features = ["csr"] }
gloo-net = "0.7"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "Storage",
  "Location", "History", "Navigator", "Geolocation", "Position", "Coordinates",
  "PositionOptions", "PositionError", "EventTarget", "Node",
] }
