name: TestFlight

# Déclenchement manuel uniquement. Un envoi TestFlight consomme un numéro de
# build et prévient les testeurs : ça ne doit pas partir à chaque fusion.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Nouveautés pour les testeurs"
        required: false
        default: ""

# Un envoi à la fois : deux archives concurrentes se disputeraient le même
# numéro de build.
concurrency:
  group: testflight
  cancel-in-progress: false

# `shell: bash` vaut `bash -eo pipefail` : sans cela, « xcodebuild | formateur »
# réussirait dès que le formateur réussit, et un échec de compilation passerait
# pour un succès.
defaults:
  run:
    shell: bash

jobs:
  build:
    # « macos-latest » plutôt qu'une version figée : une étiquette de version
    # qui n'est pas servie à ce compte fait échouer le job avant toute étape,
    # sans un seul journal — symptôme peu bavard et facile à confondre avec un
    # problème de facturation.
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJECT: ios/Kliima.xcodeproj
      SCHEME: Kliima
      ARCHIVE: ${{ github.workspace }}/build/Kliima.xcarchive
      EXPORT: ${{ github.workspace }}/build/export

    steps:
      - uses: actions/checkout@v5

      # On s'arrête tout de suite plutôt qu'après vingt minutes de compilation :
      # une archive signée avec des secrets manquants échouerait à l'envoi.
      - name: Vérifier que les secrets sont là
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets absents :$missing — voir ios/Tools/TESTFLIGHT.md"
            exit 1
          fi

          # Le reste est facultatif. Sans certificat fourni, on s'en remet à la
          # signature gérée par Apple : « -allowProvisioningUpdates » récupère
          # un certificat de distribution dont la clé privée reste chez eux,
          # ce qui convient à un exécuteur qui disparaît après usage.
          [ -n "$CERT_P12" ] && echo "certificat fourni" || echo "pas de certificat : signature gérée par Apple"
          [ -n "$TEAM_ID" ] && echo "équipe imposée" || echo "équipe déduite de la clé" 

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Le cœur partagé porte les règles que le Swift recopie. S'il est rouge,
      # rien ne sert de compiler l'application.
      - name: Tests du cœur partagé
        run: |
          bun install --frozen-lockfile
          bun test

      - name: Revalider le projet Xcode
        run: python3 ios/Tools/validate_pbxproj.py "$PROJECT/project.pbxproj"

      - name: Choisir Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Dire quelle version compile
        run: |
          xcodebuild -version
          # xcbeautify rend les journaux lisibles quand il est là ; sinon on
          # laisse passer la sortie brute plutôt que d'échouer sur son absence.
          if command -v xcbeautify > /dev/null; then
            echo "FORMATTER=xcbeautify --renderer github-actions" >> "$GITHUB_ENV"
          else
            echo "FORMATTER=cat" >> "$GITHUB_ENV"
          fi

      # Un trousseau temporaire, détruit en fin de course : on n'écrit jamais
      # dans celui de la machine, qui est partagé entre les exécutions.
      - name: Installer le certificat de distribution
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "aucun certificat à installer — Xcode ira le chercher lui-même"
            exit 0
          fi

          keychain="$RUNNER_TEMP/kliima.keychain-db"
          password="$(uuidgen)"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Sans cette autorisation, codesign demanderait le mot de passe à
          # chaque signature — et personne n'est là pour le taper.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      # Xcode et altool cherchent la clé à cet emplacement précis.
      - name: Installer la clé App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          key=~/private_keys/AuthKey_$ASC_KEY_ID.p8

          # On accepte les deux formes : le contenu du fichier .p8 tel quel —
          # ce qu'on colle naturellement en l'ouvrant — ou son encodage en
          # base64. Refuser l'une des deux ne rend service à personne, et le
          # symptôme est trompeur : « base64 --decode » sur du PEM avale les
          # lignes « -----BEGIN----- » comme des caractères invalides et ne
          # rend que le corps binaire, que Xcode ne sait pas lire.
          case "$ASC_KEY_P8" in
            -----BEGIN*) printf '%s\n' "$ASC_KEY_P8" > "$key" ;;
            *)           printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key" ;;
          esac
          chmod 600 "$key"

          # Une clé mal collée ne se voit qu'ici. Plus loin, xcodebuild ne dit
          # que « Invalid authentication key credential » sans indiquer quoi
          # corriger — après quatre minutes de compilation.
          if ! head -c 64 "$key" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::ASC_KEY_P8 ne contient pas de clé PEM lisible. Collez le contenu du fichier AuthKey_XXXXXXXXXX.p8 tel quel, ou son encodage base64 — les deux sont acceptés."
            exit 1
          fi
          echo "clé App Store Connect lue"

          # L'export se sert du même chemin : on le calcule une fois.
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # La première exécution réelle de ces tests : le banc d'essai Linux ne
      # compile que le domaine pur, pas SwiftUI, StoreKit ni WidgetKit.
      # La première exécution réelle de ces tests : le banc d'essai Linux ne
      # compile que le domaine pur, pas SwiftUI, StoreKit ni WidgetKit.
      - name: Tests iOS sur simulateur
        run: |
          # Le nom des simulateurs change avec Xcode : on prend le dernier
          # iPhone disponible plutôt que d'en coder un en dur.
          simulateur="$(xcrun simctl list devices available \
            | grep -oE 'iPhone [^(]+' | sed 's/ *$//' | sort -V | tail -1)"
          [ -n "$simulateur" ] || { echo "::error::aucun simulateur iPhone disponible"; exit 1; }
          echo "simulateur retenu : $simulateur"

          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$simulateur" \
            CODE_SIGNING_ALLOWED=NO | $FORMATTER

      # Le numéro de build doit croître à chaque envoi : App Store Connect
      # refuse deux fois le même. Le numéro d'exécution s'en charge.
      - name: Archiver
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            ${TEAM_ID:+DEVELOPMENT_TEAM=$TEAM_ID} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | $FORMATTER

      - name: Exporter l'ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            ${TEAM_ID:+<key>teamID</key><string>$TEAM_ID</string>}
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Envoyer sur TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ipa="$(find "$EXPORT" -name '*.ipa' -maxdepth 1 | head -1)"
          [ -n "$ipa" ] || { echo "::error::aucun .ipa exporté"; exit 1; }
          echo "envoi de $(basename "$ipa")"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # On garde l'archive : c'est elle qui porte les symboles de débogage,
      # sans lesquels un rapport de plantage reste illisible.
      - name: Conserver l'archive
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Kliima-${{ github.run_number }}.xcarchive
          path: ${{ env.ARCHIVE }}
          retention-days: 30
          if-no-files-found: ignore

      # Même en cas d'échec : un trousseau laissé ouvert contient une clé
      # privée de signature.
      - name: Effacer le trousseau
        if: always()
        run: |
          # Sans ce test, un arrêt survenu avant la création du trousseau
          # afficherait « SecKeychainDelete: Operation not permitted » — une
          # erreur sans objet, mais que le lecteur du journal prend pour un
          # symptôme.
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf ~/private_keys
