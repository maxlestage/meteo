name: Site de présentation

# Publie la vitrine sur GitHub Pages à chaque poussée sur la branche par défaut,
# et l'application web à côté d'elle, sous /app/.
#
# Le dépôt doit avoir Pages activé sur « GitHub Actions »
# (Settings → Pages → Source). Ça ne s'automatise pas : voir plus bas.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois, sans annuler celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Le cœur partagé porte les règles agronomiques citées par la page.
      - name: Tests du cœur partagé
        run: bun test

      # `build` enchaîne tsc puis vite : une erreur de types arrête la publication.
      #
      # `VITE_KLIMA_RELAY` désigne le relais. Variable de dépôt, pas secret :
      # c'est une adresse publique, elle finit dans le paquet servi. Tant
      # qu'elle est vide, le site et l'application appellent les fournisseurs
      # en direct.
      - name: Construction de la vitrine
        run: bun run --cwd site build
        env:
          VITE_KLIMA_RELAY: ${{ vars.KLIMA_RELAY }}

      - name: Construction de l'application web
        run: bun run --cwd web build
        env:
          VITE_KLIMA_RELAY: ${{ vars.KLIMA_RELAY }}

      # L'application est servie depuis un sous-chemin de la vitrine. Les deux
      # projets construisent en chemins relatifs (`base: './'`), il n'y a donc
      # rien à reconfigurer pour qu'elle vive sous /app/.
      - name: Assemblage de la publication
        run: cp -r web/dist site/dist/app

      # Sans Pages activé dans les réglages, cette étape échoue sur « Get Pages
      # site failed » et tout ce qui précède est perdu. « enablement: true » a
      # été essayé : le jeton du workflow a bien « pages: write », mais créer le
      # site demande les droits d'administration du dépôt, qu'il n'a pas —
      # « Create Pages site failed: Resource not accessible by integration »
      # (exécution nº 26). C'est une case à cocher, une fois, à la main.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
