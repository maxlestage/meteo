name: Site de présentation

# Publie la vitrine sur GitHub Pages à chaque poussée sur la branche par défaut,
# et l'application web à côté d'elle, sous /app/.
#
# Le dépôt doit avoir Pages activé sur « GitHub Actions »
# (Settings → Pages → Source). Ça ne s'automatise pas : voir plus bas.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois, sans annuler celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # La chaîne Rust est épinglée par `rust-toolchain.toml` ; la cible du
      # navigateur y figure aussi, rustup la pose donc tout seul.
      - name: Chaîne Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/klima-ui
            rust/klima-web
            rust/klima-site

      # Le cœur partage ses règles avec les deux interfaces : une règle fausse
      # publierait une page qui annonce autre chose que ce qu'elle applique.
      - name: Tests du cœur et du relais
        run: cargo test
        working-directory: rust

      # Trunk est téléchargé déjà compilé : le compiler prendrait plus de temps
      # que tout le reste de la publication.
      - name: Trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --silent \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `KLIMA_RELAY` désigne le relais. Variable de dépôt, pas secret : c'est
      # une adresse publique, elle finit dans le paquet servi. Tant qu'elle est
      # vide, le site et l'application appellent les fournisseurs en direct.
      - name: Construction de la vitrine
        run: trunk build --release --config klima-site/Trunk.toml
        working-directory: rust
        env:
          KLIMA_RELAY: ${{ vars.KLIMA_RELAY }}

      - name: Construction de l'application web
        run: trunk build --release --config klima-web/Trunk.toml
        working-directory: rust
        env:
          KLIMA_RELAY: ${{ vars.KLIMA_RELAY }}

      # L'application est servie depuis un sous-chemin de la vitrine. Les deux
      # projets construisent en chemins relatifs (`public_url = "./"`), il n'y
      # a donc rien à reconfigurer pour qu'elle vive sous /app/.
      - name: Assemblage de la publication
        run: |
          mkdir -p rust/klima-site/dist/app
          cp -r rust/klima-web/dist/. rust/klima-site/dist/app/

      # Sans Pages activé dans les réglages, cette étape échoue sur « Get Pages
      # site failed » et tout ce qui précède est perdu. « enablement: true » a
      # été essayé : le jeton du workflow a bien « pages: write », mais créer le
      # site demande les droits d'administration du dépôt, qu'il n'a pas —
      # « Create Pages site failed: Resource not accessible by integration »
      # (exécution nº 26). C'est une case à cocher, une fois, à la main.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: rust/klima-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
